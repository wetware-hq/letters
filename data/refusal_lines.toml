# Every refusal code in letters.py (scripts/refusalcodes.py) and its wording. status: signed (source given),
# awaiting (named in docs/RULINGS.md as awaiting sign-off) or untraced (no signed source found in the repo or the
# rulings folder yet; introduced in the commit given). test_refusal_codes_listed keeps this file and the code in step.

[[code]]
key = "DATE_REFUSED"
text = "Refused: line L{n} of the notes has a date outside 1 Jan 1930 to 31 Dec 1939. Nothing was written.\nIf these are real notes, delete them and use synthetic data only."
status = "untraced"
source = "introduced ca30df7 2026-10-14"

[[code]]
key = "NOTE_COPY_REFUSED"
text = "Refused: line L{n} mentions a copy. letters never sends copies. If this isn't a copy request, rerun with `--not-copy L{n}`. Nothing was written."
status = "untraced"
source = "introduced 3fbe293 2026-10-13"

