# Every refusal code in letters.py (scripts/refusalcodes.py), its text, the check that raises it (used for the
# CQ-LETTER-BY-HAND line) and its sign-off status.
# status: signed = signed in both letters_refusals_SAFETY.md (Physician) and
#   letters_refusals_WORDING.md (Educator), 14 Oct 2026; held = held by Physician in SAFETY.md (first sign-off or re-sign), not signed;
#   signed-earlier = signed under an earlier ruling (source given) but not in those two files.
# test_refusal_codes_listed keeps this file and the code in step; test_refusal_codes_signed_in_both_files is the
# strict xfail that lists every line not yet signed in both files.

