# Jurisdiction term scan (tests: test_jurisdiction_scan.py). Hand-written denylist; no external list imported.
# Each category is its own check id. Local names and values go in site-profile data, never in the core.

[categories]
J-COUNTRY  = '\b(Australia|Australian|Aussie|New Zealand|Aotearoa|United Kingdom|USA)\b'
J-STATE    = '\b(NSW|New South Wales|Victoria|Victorian|Queensland|QLD|Tasmania|Northern Territory|Western Australia|South Australia)\b'
J-CITY     = '\b(Sydney|Melbourne|Brisbane|Perth|Adelaide|Hobart|Canberra|Parramatta|Westmead)\b'
J-AGENCY   = '\b(AHPRA|PBS|TGA|Medicare|RANZCP|RACGP|eMR|CERS|NSW Health|ACSQHC|NHS|NICE)\b'
J-POLICY   = '\bPD ?\d{4}_\d+'
J-EMERG    = '(?<![\d.,\w$-])(000|111|911|999|112)(?![\d,\w-]|\.\d)|\b13 ?11 ?14\b|\b1[38]00 ?\d{3} ?\d{3}\b|\(0\d\) ?\d{4} ?\d{4}|\+61'
J-PROGRAM  = '\bREACH\b'
J-GP       = '\bGPs?\b'
J-CURRENCY = 'A\$|\bAUD\b'
J-JOBTITLE = '\b(VMO|CMO|CNC|CNE|JMO|Nurse Unit Manager|RMO|SRMO)\b(?! *=)'

[planted]
J-COUNTRY  = "Australia"
J-STATE    = "NSW"
J-CITY     = "Sydney"
J-AGENCY   = "AHPRA"
J-POLICY   = "PD2020_018"
J-EMERG    = "call 000"
J-PROGRAM  = "REACH"
J-GP       = "GP"
J-CURRENCY = "A$5"
J-JOBTITLE = "VMO"

